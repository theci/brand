product: 데일리 수분 로션
slug: daily-lotion
version: 1
regime: cosmetics
product_type: leave_on       # 안 씻어냄 → 알러젠 임계값 0.001% (엄격)
status: 개발중
base_batch_g: 200
phases:
  # 수상(water phase): 물에 녹는 것들. 유상과 같은 온도(70~75도)로 가열해야 잘 섞임.
  - name: A (수상)
    process: 70~75도로 가열하며 잔탄검을 글리세린에 먼저 개어 넣어 뭉침 방지
    ingredients:
      - { id: water, percent: 78.3 }
      - { id: glycerin, percent: 5.0 }
      - { id: sodium-hyaluronate, percent: 0.1 }
      - { id: xanthan-gum, percent: 0.3 }
  # 유상(oil phase): '산뜻 로션'답게 유상 ~13%로 가볍게(비율 유지→HLB 균형 보존).
  - name: B (유상)
    process: 70~75도로 가열해 유화제·지방알코올·오일·버터를 완전 용해
    ingredients:
      - { id: glyceryl-stearate-citrate, percent: 4.0 }
      - { id: cetyl-alcohol, percent: 1.5 }
      - { id: jojoba-oil, percent: 3.0 }
      - { id: squalane, percent: 2.5 }
      - { id: shea-butter, percent: 1.5 }
  # 유화: A에 B를 부으며 균질기로 유화 → 40도 이하로 냉각 후 C 투입
  - name: C (냉각 첨가)
    process: 40도 이하로 냉각한 뒤 보존제·향·산화방지제 투입(열에 약함)
    ingredients:
      - { id: phenoxyethanol, percent: 1.0 }
      - { id: hexanediol, percent: 2.0 }
      - { id: tocopherol, percent: 0.5 }
      - { id: lavender-eo, percent: 0.3 }
packaging:
  - { id: jar-50ml, qty_per_unit: 1 }
fill_volume_ml: 50
notes: >
  O/W(수중유형) 라이트 에멀전 로션. percent 합계 100.
  물이 들어가므로 보존제(페녹시에탄올) 필수. 유상·수상을 같은 온도로 가열해 유화.
