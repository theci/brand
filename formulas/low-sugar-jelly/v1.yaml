product: 저당 포도 젤리
slug: low-sugar-jelly
version: 1
regime: food                 # ★ 식품위생법(일반식품). STEP 0 advise 결과를 그대로.
product_category: 과자류_젤리  # 식품유형(표시용). food 레짐은 시험비 조회에 쓰지 않음.
# product_type은 화장품 개념(씻어냄/안씻어냄)이라 식품엔 의미 없지만 코어 필수 필드라 placeholder.
product_type: leave_on
status: 개발중
base_batch_g: 1000           # 홈 개발 배치 1kg
phases:
  # 식품은 '상(phase)'을 가열·냉각 공정 단계로 사용한다.
  - name: A (가열 용해)
    process: 정제수에 알룰로스·사과농축과즙·젤라틴을 넣고 80도로 저어 완전히 용해
    ingredients:
      - { id: purified-water, percent: 54.5 }
      - { id: allulose, percent: 25.0 }
      - { id: apple-juice-concentrate, percent: 10.0 }
      - { id: gelatin, percent: 8.0 }
  - name: B (냉각 후 첨가)
    process: 60도 이하로 식힌 뒤 구연산·착향료를 넣고 몰드에 충전, 냉장 응고
    ingredients:
      - { id: citric-acid-food, percent: 2.0 }
      - { id: grape-flavor-food, percent: 0.5 }
net_weight_g: 30             # 젤리 1컵 30g(1회 제공량 기준 영양 환산에 사용)
notes: >
  저당 포도 젤리(일반식품). 설탕 대신 알룰로스로 당류를 낮춤. percent 합계 100.
  기능성(혈당·다이어트 등)을 표방하면 건강기능식품 영역이 되므로 표시·광고 주의.
