# 고체 샴푸바 2^3 완전요인 스크리닝
# 변수: 계면활성제 총%(surfactant), 바인더(세틸알코올)%(binder), 버터%(butter)
# 평가: 거품/세정력/헹굼/경도/컨디셔닝/잔여감 1~5점
name: 샴푸바 스크리닝
formula_ref: shampoo-bar
factors: [surfactant, binder, butter]
levels:
  surfactant: { low: 55, high: 68 }
  binder: { low: 10, high: 18 }
  butter: { low: 8, high: 16 }
response_items: [거품, 세정력, 헹굼, 경도, 컨디셔닝, 잔여감]

runs:
