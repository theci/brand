[project]
name = "brandlab"
version = "0.1.0"
description = "화장품 1인 브랜드 처방 관리 도구 (모델 + 로더)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "matplotlib>=3.8",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
brandlab = "brandlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brandlab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
