  24: [꿀추출물, 꿀]
  48: [글리세릴스테아레이트]
  52: [호호바씨오일]
  55: [동백나무씨오일]
  63: [미네랄오일, 페트롤라툼]
  72: [코코넛야자오일]
  94: [다이메티콘]
  103: [녹차추출물, 차잎추출물]
  116: [알로에베라잎즙, 알로에베라잎추출물]
