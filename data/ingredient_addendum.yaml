    structure: "AOS(N01) 주세정 + 라우레스설포석시네이트(N02) 자극 완화 + 소금(N03) 점증 + 글리세린·PG라우레이트 보습감. 꿀·마카다미아는 3,000ppm 강조, 뒤쪽 발효물·추출물 40여 종은 극미량 스토리 성분."
