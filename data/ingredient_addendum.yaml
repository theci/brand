# rows: [구분, 항목, 확인된 내용, 금액(추정), verdict, 출처 키]
launch:
  note: "히어로 기준 = 50mL 크림 × MOQ 1,000개, OEM 위탁 + 책임판매업. 금액은 2026-10 공개 자료 기반 추정 — 공장·시험기관 견적으로 확정."
  rows:
    - [등록·자격, 책임판매관리자 자격, "이공계 학사(화학공학 포함)는 경력 없이 자격. 상시근로자 10명 이하면 대표 본인이 겸직 가능(시행규칙 제8조). 화학공학 '전문학사'는 경력 1년 필요.", "", 확인, easylaw]
    - [등록·자격, 책임판매업 등록 수수료, "전자민원 27,000원 / 방문·우편 30,000원. 처리기간 10일. 의약품안전나라 신청.", "27,000원", 확인, gov24]
    - [등록·자격, 등록면허세, "수수료와 별도(지방세법). 영수증을 의약품안전나라에 올려야 등록증 출력. 종별·인구별 차등 — 책임판매업이 몇 종인지 공식 확인 못 함 → 관할 구청·위택스 문의.", "약 1.8만~6.75만원(미확정)", 미확인, ansan]
    - [등록·자격, 책임판매관리자 의무 교육, "최초 = 등록 후 6개월 이내, 이후 매년 1회(연도 기준, 12/31까지). 미이수 시 과태료 50만원. 온라인 6시간 과정 기준 288분 이상 수강 + 평가 60점.", "교육비 별도", 정정, kcia]
    - [등록·자격, 통신판매업 신고, "스마트스토어·자사몰 판매 시 필요(조사에서 누락). 간이과세자 등 면제 조건 있음 — 확인 필요.", "", 미확인, ""]
    - [인증, 천연·유기농화장품 정부 인증, "화장품법 개정 2025.1.31 공포 → 2025.8.1 시행으로 식약처 인증제 폐지, 민간 자율로 전환. 이제 '천연·유기농화장품 표시·광고 안내서'(식약처+업계) 기준 충족 + 실증자료, 또는 COSMOS 등 민간 인증. KCL 114만원은 폐지 전 인증심사비.", "정부 인증비 0원(제도 없음)", 정정, cnc]
    - [인증, 해외 비건 인증(EVE 등), "공개 가격 없음. EVE 국내 파트너 계약이 2024년 해지 통보 → 현재 국내 창구 재확인 필요. 다도기는 비건 소구 계획 없음.", "견적 필요", 미확인, kyeonggi]
    - [품질검사, 제조번호별 품질검사 의무, "책임판매업자 의무는 맞음. 단, 외부 기관 필수 아님 — 제조업자에게 받은 제품표준서·품질관리기록서 보관, 지정기관 위탁 결과 등으로 갈음 가능(시행규칙 제11·12조). CGMP 공장 시험실이 로트별 검사하는 경우가 많아 견적 포함 여부 확인.", "0원~수십만원(포함 여부)", 정정, law12]
    - [품질검사, 유통화장품 안전관리 기준 항목, "중금속 6종: 납 20·니켈 10(눈화장 35)·비소 10·수은 1·안티몬 10·카드뮴 5 µg/g 이하(조사의 '5종'은 니켈 누락). 다이옥산·프탈레이트 각 100ppm 이하. 미생물·내용량·pH 등.", "", 정정, metro]
    - [품질검사, 방부력·안정성 시험, "공개 가격 없음 → 시험기관 견적(KTR 뷰티소비재센터 02-2092-3722). 조사의 '30~50만원'은 근거 미확인.", "견적 필요", 미확인, ktr]
    - [품질검사, 순서, "양산 → 로트 샘플 검사 → 적합 판정 후 출고. 맞음.", "", 확인, law12]
    - [OEM, "MOQ 1,000개", "'대중적 최소수량'은 과장. 기초화장품 기준 SKU당 보통 3,000~5,000개, 1,000개는 건별 상담·소량 전문사(예: 연제 2,000~3,000개, 스피드코스 1,000개~). 소량일수록 개당 단가↑.", "", 정정, pangaea]
    - [OEM, 매칭 플랫폼, "셀프코스(selfcos — 조사의 '셀코스'), 팩토스퀘어는 실재. '매치메이드'는 확인 못 함.", "", 정정, selfcos]
    - [OEM, 계약 조항, "처방 소유권·납기 지연 배상·부적합 재생산·NDA·계약금/잔금 50:50은 권고로는 타당하나 업계 표준이란 근거 없음 → 변호사 검토 권장.", "", 미확인, ""]
    - ["예산(50mL×1,000)", 내용물, "크림 g당 5~6원(셀프코스 2023, 5,000개 기준) × 50g, 소량 할증 감안.", "30~60만원", 미확인, selfcos]
    - ["예산(50mL×1,000)", 임가공·충진, "개당 약 500원 안팎(셀프코스 2023).", "50~80만원", 미확인, selfcos]
    - ["예산(50mL×1,000)", 용기(50mL 자), "개당 500~2,000원(사양·후가공에 따라).", "50~200만원", 미확인, selfcos]
    - ["예산(50mL×1,000)", 단상자, "개당 250~700원 + 인쇄 판비.", "25~70만원", 미확인, selfcos]
    - ["예산(50mL×1,000)", 라벨, "소량 스티커 인쇄.", "5~20만원", 미확인, ""]
    - ["예산(50mL×1,000)", 등록, "수수료 + 등록면허세(최초 1회).", "5~10만원", 확인, gov24]
    - ["예산(50mL×1,000)", 합계(생산 기준), "교차확인: 5,000개 기준 개당 원가 1,800~3,900원(내용물+용기+단상자) → 1,000개는 더 높음. 조사의 300~600만원은 큰 틀에서 타당.", "약 170~450만원", 확인, pangaea]
    - ["예산(50mL×1,000)", 조사에서 빠진 비용, "샘플 수정 차수, 디자인 외주, 바코드(GS1) 가입, 통신판매업 신고, 택배·포장재, 생산물배상책임보험(선택).", "별도", 미확인, ""]
    - [미팅 질문, 공장에 꼭 물을 3가지, "① 로트별 품질검사(성적서)가 견적에 포함인가 ② 1,000개 수락 여부와 할증 ③ 샘플 수정 몇 차까지 무료인가.", "", 확인, ""]
