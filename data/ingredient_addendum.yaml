# 원료 추가노트 데이터 — 실제 제품 전성분 사진을 해부하며 쌓는 '1권 원료 마스터' 증보.
# 생성: uv run python scripts/ingredient_addendum.py  → 원료_추가노트.xlsx
#
# 쌓는 법 (제품 사진 1장 = 아래 3곳 갱신)
#   1) products 에 제품 1개 추가: 전성분을 라벨 순서대로 "전성분 표기 | 참조 | 한 줄 메모"
#        ⚠ 한 줄 전체를 큰따옴표로 감쌀 것 (안 감싸면 YAML이 ' #13'을 주석으로 버림)
#        참조 = "#번호"(1권 원료 카드 No) 또는 "N번호"(이 파일의 신규 카드)
#   2) 1권에 없던 원료는 new_cards 에 N번호를 이어서 추가 (first_seen = 제품 id)
#   3) 1권 카드가 전성분에선 다른 이름으로 나오면 aliases 에 추가 (다음 매칭이 빨라짐)
# ⚠ %·규제 수치는 교육용 정리(추정 포함) — 판매 전 식약처 고시·공급사 TDS로 재확인.

# 1권 원료 카드 No → 전성분(식약처 표준명)에서 실제로 보이는 표기
