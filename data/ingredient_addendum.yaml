  rows:
    - ["정체", "향료란", "조향사가 합성 향 원료(대부분) + 천연 에센셜오일·앱솔루트를 수십~수백 가지 섞은 조합향. 향수처럼 톱(첫 향)·미들(몸통)·베이스(잔향) 노트를 쌓아 '어코드'를 만든다.", "N39 향료"]
    - ["정체", "형태", "기름에 녹는 액체(오일성). 물에 안 녹으므로 바디워시는 계면활성제가, 크림은 유상·유화가, 맑은 토너는 가용화제가 녹여 준다.", "#200 PEG-40 HCO(가용화)"]
    - ["정체", "누가 만드나", "향료 전문회사(Givaudan · dsm-firmenich · IFF · Symrise 등 글로벌, 국내 향료사). 브랜드·OEM은 '○○ 계열' 샘플을 받아 고르고, 처방은 향료사가 보유.", ""]
    - ["표시 규정", "왜 '향료'만 적나", "화장품법 시행규칙(전성분 표시): 착향제는 '향료'로 표시 가능 → 영업비밀 보호. 단 식약처 지정 알레르기 유발성분 25종은 기준 초과 시 성분명을 따로 표시.", ""]
    - ["표시 규정", "표시 기준", "씻어내는 제품 0.01% 초과 · 바르는 제품 0.001% 초과(완제품 기준). 바르는 제품이 10배 엄격.", "N40~N48"]
    - ["표시 규정", "천연 오일도 해당", "라벤더 오일 → 리날룰, 오렌지 → 리모넨, 로즈제라늄 → 시트로넬올·제라니올. '천연 향'이어도 표시 의무는 같다.", "#226~#247 에센셜오일"]
    - ["표시 규정", "수출 시", "EU는 표시 대상 알레르기 성분을 약 80종으로 확대(Reg. (EU) 2023/1545, 경과기간 후 적용) — 수출 계획이 있으면 향료사에 EU 확대 목록 기준 함량표도 요청.", ""]
    - ["읽는 법", "보이는 건 일부", "전성분에 나오는 건 25종 중 기준을 넘은 것뿐. 머스크·헬리오트로핀·바닐린처럼 향의 몸통인 원료는 안 보인다(아래 '안 보이는 원료').", ""]
    - ["읽는 법", "개수로 향료량 짐작", "알레르기 성분 개수가 많을수록 향료가 넉넉하거나 플로럴·시트러스 비중이 크다. P001(씻어내는·느슨한 기준)인데 9개 → 향료 넉넉(1% 안팎 추정). P002(바르는·엄격한 기준)인데 4개 → 향료 적거나 분내 위주.", "P001 · P002"]
    - ["읽는 법", "함량 역산 예시", "향료 0.3% × 그 안의 쿠마린 2% = 완제품 0.006% → 바르는 기준 0.001% 초과라 표시. 같은 향을 바디워시에 1% 넣으면 0.02% → 씻어내는 기준 0.01% 초과라 표시.", ""]
    - ["읽는 법", "순서는 무의미", "향료·알레르기 성분은 1% 이하 구간이라 서로 순서로 양을 비교할 수 없다.", ""]
    - ["읽는 법", "공통 뼈대 찾기", "두 제품 공통 = 쿠마린 · 알파-아이소메틸아이오논 · 시트로넬올 · 하이드록시시트로넬알 → '분내 + 깨끗한 플로럴'(베이비파우더 계열). 인기 향을 따라 만들 때 향료사에 줄 브리프의 출발점.", "N43 · N40 · N42 · N47"]
    - ["쓰는 법", "사용량", "씻어내는 제품 0.5~1.5% · 바르는 제품 0.1~0.5%. 0.1 / 0.3 / 0.5% 3단 샘플로 사용감·잔향 비교 후 결정.", "N39"]
    - ["쓰는 법", "넣는 시점", "크림·로션은 유화 후 40℃ 이하로 식었을 때(열에 휘발·변질). 바디워시는 향료가 점도 곡선(소금 반응)을 바꾸므로 향 넣은 뒤 점도 재조정.", "N03 소금"]
    - ["쓰는 법", "꼭 받을 서류", "① IFRA 인증서(제품 카테고리별 최대 사용량 — 예: 핸드크림·바디로션 등 바르는 제품 Cat.5, 씻어내는 바디워시 Cat.9) ② 알레르기 성분 함량표(전성분 표시 계산용) ③ SDS ④ 희석 용제 정보(DPG 등 — 전성분에 적어야 할 수도).", "N09 DPG"]
    - ["쓰는 법", "안정성 체크", "바닐린 계열은 흰 크림을 누렇게 변색, 시트러스(리모넨)는 산화되면 감작성↑ → 40℃·일광 보관 안정성 테스트에 향·색 변화를 반드시 포함.", "N44"]
    - ["쓰는 법", "구하는 길", "① OEM 통해 향료사 샘플 요청(가장 현실적) ② 원료몰 화장품용 향료 소량 구매(IFRA·함량표 주는 곳만) ③ 1권 에센셜오일로 직접 블렌딩(천연, 단 알레르기 성분 표시는 같음).", "#226~#247"]
    - ["다도기", "히어로와의 관계", "다도기 히어로 크림은 무향·말라세지아 세이프 원칙 → 향료 없음. 이 시트는 두 번째 제품·향 라인을 만들 때의 공부용.", ""]
