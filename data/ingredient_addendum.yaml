  - id: P002
    name: 바세린 모이스처 이엑스 핸드 앤 네일 에센스 크림
    brand: 과일나라 (Vaseline essence 라인 · 제조/책임판매 (주)웰코스)
    type: 핸드크림 (바르는 제품, O/W 크림)
    volume: 500 mL
    date: 2026-10-29
    photo: 제품사진/P002_과일나라_바세린모이스처이엑스핸드앤네일에센스크림_전성분.jpeg
    structure: "미네랄오일(#63) 오일상 + 글리세린 보습. 유화는 고전 드럭스토어 세트 3겹: GMS+PEG-100스테아레이트(Arlacel 165형) · 폴리솔베이트60+솔비탄스테아레이트(Tween/Span 쌍) · 세테아릴알코올 바디. 팔미틱·스테아릭애씨드를 KOH로 일부 중화(칼륨 비누)해 '배니싱 크림'처럼 끈적임 없는 마무리, 같은 KOH가 카보머도 중화. 방부 페녹시에탄올+클로페네신."
    scent: "향료 + 알레르기 성분 4개(쿠마린·알파-아이소메틸아이오논·시트로넬올·하이드록시시트로넬알) — P001과 같은 '분내 + 깨끗한 플로럴' 뼈대. 바르는 제품은 0.001% 초과부터 표시라 향료량이 많지 않아도 표시된다."
    lesson: "① 제품명 '바세린'인데 페트롤라툼은 100g당 100mg = 0.1%뿐 — 실제 오일상은 3번째 미네랄오일. 이름 원료 ≠ 주원료, 함량 표기가 진실 ② 비타민E유도체·우레아·병풀·'Moisture 24 Complex'는 모두 1% 이하 구간 스토리 성분 ③ 지방산+KOH 부분 비누화 = 저렴하고 끈적이지 않는 대용량 크림의 정석 ④ 말라세지아 관점에선 폴리솔베이트·지방산·에스터가 줄줄이 ✕ → 다도기 히어로와 정반대 설계."
    note: "1% 이하 성분은 순서 자유 — 페트롤라툼(0.1%) 뒤 성분은 전부 0.1% 이하일 가능성이 높다(규정상 확정은 아님)."
    ingredients:
