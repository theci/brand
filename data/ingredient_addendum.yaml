# 원료 추가노트 데이터 — 실제 제품 전성분 사진을 해부하며 쌓는 '1권 원료 마스터' 증보.
# 생성: uv run python scripts/ingredient_addendum.py  → 원료_추가노트.xlsx
#
# 쌓는 법 (제품 사진 1장 = 아래 3곳 갱신)
#   1) products 에 제품 1개 추가: 전성분을 라벨 순서대로 "전성분 표기 | 참조 | 한 줄 메모"
#        ⚠ 한 줄 전체를 큰따옴표로 감쌀 것 (안 감싸면 YAML이 ' #13'을 주석으로 버림)
#        참조 = "#번호"(1권 원료 카드 No) 또는 "N번호"(이 파일의 신규 카드)
#   2) 1권에 없던 원료는 new_cards 에 N번호를 이어서 추가 (first_seen = 제품 id)
#   3) 1권 카드가 전성분에선 다른 이름으로 나오면 aliases 에 추가 (다음 매칭이 빨라짐)
# ⚠ %·규제 수치는 교육용 정리(추정 포함) — 판매 전 식약처 고시·공급사 TDS로 재확인.

# 1권 원료 카드 No → 전성분(식약처 표준명)에서 실제로 보이는 표기
aliases:
  14: [프로판다이올]
  16: [소듐하이알루로네이트, 하이알루로닉애씨드]
  17: [부틸렌글라이콜]
  24: [꿀추출물, 꿀]
  52: [호호바씨오일]
  55: [동백나무씨오일]
  72: [코코넛야자오일]
  103: [녹차추출물, 차잎추출물]
  116: [알로에베라잎즙, 알로에베라잎추출물]
  154: [쇠비름추출물]
  156: [포트마리골드꽃추출물]
  189: [시트릭애씨드]
  195: [다이소듐이디티에이]

# 1권에 없던 원료. role 은 1권 카드 역할 어휘를 그대로 쓴다(+ 부산물).
new_cards:
  # ── 세정 베이스 ─────────────────────────────────────────
  - id: N01
    name: 소듐C14-16올레핀설포네이트
    inci: Sodium C14-16 Olefin Sulfonate
    role: 계면
    sub: 주세정제(음이온) · AOS
    what: 석유/식물 유래 알파올레핀(C14~16)을 술폰화한 음이온 계면활성제. 보통 35~40% 수용액으로 유통.
    feel: 거품이 많고 빨리 일어남, 세정력 강함, 헹굼 후 뽀득.
    pct: 바디워시 활성분 기준 8~15% (원료 그대로면 20~40%)
    why: 저렴하고 기포·세정력이 좋아 대용량 바디워시의 주세정제. '설페이트(SLS/SLES) 프리'를 표방하면서 비슷한 세정감을 낼 때 자주 쓴다.
    caution: 단독이면 자극·건조 → 마일드 보조세정제(N02·글루타메이트·베타인)와 섞어 완화. 씻어내는 제품 전용.
    malassezia: ○ 씻어내는 계면활성제라 우려 낮음
    related: "#208 SLES(대체 관계) · #211 SLSA"
    first_seen: P001
  - id: N02
    name: 다이소듐라우레스설포석시네이트
    inci: Disodium Laureth Sulfosuccinate
    role: 계면
    sub: 보조세정제(음이온, 마일드)
    what: 라우릴 알코올 에톡실레이트 + 말레산(설포석시네이트) 구조의 순한 음이온 계면활성제. 30~40% 액상.
    feel: 크리미한 거품, 자극 적음.
    pct: 활성분 2~8%
    why: 강한 주세정제(N01)의 자극을 줄이면서 거품 질을 부드럽게. 베이비·마일드 샴푸에도 쓰인다.
    caution: 에톡시화 원료(이름의 '레스') → 1,4-다이옥산 잔류 관리 원료. 공급사 CoA 확인.
    malassezia: ○ 씻어내는 제품
    related: "#201 CAPB · #206 소듐코코일글루타메이트(같은 '자극 완화' 역할)"
    first_seen: P001
  - id: N03
    name: 소듐클로라이드
    inci: Sodium Chloride
    role: 점증
    sub: 계면 시스템 점도 조절(소금 점증)
    what: 소금. 음이온 계면활성제 용액에 넣으면 미셀이 길게 자라 점도가 오른다.
    feel: 그 자체로 감촉 없음.
    pct: 0.5~2% (제품마다 '소금 곡선' 정점이 다름)
    why: 세정제를 걸쭉하게 만드는 가장 싸고 흔한 방법. 이 제품에서 3번째로 많다 = 점도의 주역.
    caution: 정점을 넘기면 점도가 다시 뚝 떨어진다 → 0.2%씩 나눠 넣으며 확인. 스크럽용 소금(#217)과 역할이 다름.
    malassezia: ○
    related: "#217 사해소금/핑크소금(분말·스크럽용) · #25 잔탄검(다른 점증 방식)"
    first_seen: P001
  - id: N04
    name: 프로필렌글라이콜라우레이트
    inci: Propylene Glycol Laurate
    role: 에몰리언트
    sub: 점도·거품 보조, 세정 후 촉촉함
    what: 프로필렌글라이콜 + 라우르산(C12) 에스터. 비이온성 액상.
    feel: 가벼운 오일감, 세정 후 당김 완화.
    pct: 1~3%
    why: 세정제 안에서 점도를 돕고(소금과 함께) 헹군 뒤 피부에 얇은 막을 남겨 '건조하지 않은 바디워시' 느낌을 준다.
    caution: 바르고 두는 제품이면 라우르산 에스터라 말라세지아 회색지대.
    malassezia: △ C12 지방산 에스터 — 히어로 크림엔 쓰지 않음
    related: "#50 MCT오일(C8/C10 에스터, 세이프 쪽)"
    first_seen: P001
