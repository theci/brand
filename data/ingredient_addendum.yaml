    feel: —
    pct: 극미량
    why: 넣은 게 아니라 N01을 쓰면 따라 들어온 것. 식약처 전성분 표시 기준상 일정 이상이면 적는다.
    caution: 전성분 읽기 교훈 — 전성분 = '넣은 원료'가 아니라 '들어 있는 성분'. 원료 1개가 성분 여러 개로 적히기도 한다.
    malassezia: —
    related: "N01"
    first_seen: P001
  - id: N06
    name: 마카다미아씨추출물
    inci: Macadamia Integrifolia/Ternifolia Seed Extract
    role: 활성
    sub: 컨셉 원료(제품명 원료)
    what: 마카다미아 씨를 용매(물·BG 등)로 추출한 액. 오일(#76)이 아니라 수용성 추출물.
    feel: 감촉 영향 거의 없음.
    pct: 0.1~1% (이 제품 3,000ppm = 0.3%)
    why: 제품명에 들어간 원료라 함량(ppm)을 일부러 적었다. 함량 표기는 마케팅용 강조 성분일 때 흔하다.
    caution: 마카다미아 '오일 함유'와 다르다 — 이름만 보고 오일감을 기대하면 안 됨.
