# 제형 마스터리 커리큘럼 (8주 6막) — 셰프처럼 원료·제형 감각을 내재화한다.
# 교재: docs/커리큘럼/제형_아키타입_지도.md + docs/커리큘럼/원료_팔레트.md
# 난이도 순서(무수→수상→유화→활성→세정/베이스→통합)로 아키타입을 밟는다.
# 데일리 루틴 커리큘럼과 별개 트랙(진행은 progress_mastery.yaml).
# 완료 기반 진행: 결석해도 안 밀림. '주 1 사이클'(읽기→설계→제조·일지)을 반복한다.
acts:
  - id: m1
    title: 무수 기초 — 오일과 밤
    weeks: Week 1~2
    goal: 물이 없어 유화·방부 부담 제로. 오일 블렌드 감각과 왁스=경도를 손에 익힌다.
    milestone: {badge: 무수 마스터, dod: 페이스오일 1종 + 밤 1종 설계 + 사용감 일지 2건}
  - id: m2
    title: 수상 기초 — 토너·젤
    weeks: Week 3
    goal: 유화 없이 수상을 다룬다. 플로럴워터=브랜드 시그니처, 겔=텍스처를 익힌다.
    milestone: {badge: 수상 입문, dod: 토너 또는 미스트 1종 + 젤 1종 설계 + 플로럴워터 시그니처 결정}
  - id: m3
    title: 유화 핵심 — 로션에서 크림으로
    weeks: Week 4~5
    goal: 물+기름을 잇는다. 같은 유화 골격에서 오일%만 바꿔 로션↔크림을 파생한다.
    milestone: {badge: 유화 마스터, dod: 로션 1종 + 그 골격에서 파생한 크림 1종 + 유화 안정 관찰}
  - id: m4
    title: 활성·스페셜 — 앰플·팩
    weeks: Week 6
    goal: claim(주장)을 만든다. 스타 활성 1~2종에 서사를 몰고, 규제를 확인한다.
    milestone: {badge: 활성 설계자, dod: 앰플·세럼 1종(히어로 후보) + claim 규제 체크 1건}
  - id: m5
    title: 세정·확장 — 세정·샴푸·베이스 치트키
    weeks: Week 7
    goal: 세정 3형(폼·오일·밤)을 구분하고, 완제베이스+활성로 라인을 최속 전개한다.
    milestone: {badge: 빠른 전개, dod: 베이스+활성로 파생 3종 + 클렌징 1종 설계}
  - id: m6
    title: 통합 — 히어로 완주
    weeks: Week 8
    goal: 감각→제품 전체 사이클을 한 번 완주한다. 히어로 1종을 서사·비주얼까지.
    milestone: {badge: 히어로 개발자, dod: 히어로 1종 처방→원가→라벨→비주얼→서사 원페이저 + 소량 시제}
quests:
  # --- ACT M1 (Week 1~2) 무수 기초 ---
  - {id: m1-w1-d1, act: m1, week: 1, kind: desk, est_min: 25, text: "아키타입 지도 §0(2축)+§7 오일 정독. 팔레트 '먼저 이 8개'+오일/버터/왁스/보존 카드 읽기"}
  - {id: m1-w1-d2, act: m1, week: 1, kind: desk, est_min: 30, text: "페이스오일 예시 3종(페이셜트리트먼트오일 등) 엑셀 특징열까지 읽고 공통 골격(에몰리언트94%+토코페롤) 손으로 적기"}
  - {id: m1-w1-d3, act: m1, week: 1, kind: desk, est_min: 30, text: "내 브랜드용 페이스오일 변주 1종 설계 → formulas/에 작성, checks로 합계100·상충 확인"}
  - {id: m1-w1-l1, act: m1, week: 1, kind: lab, text: "오일 workhorse 3종(호호바·스쿠알란·로즈힙 등) 소량 제조·블렌딩 + 사용감 일지(발림·흡수·향·잔여감)"}
  - {id: m1-w2-d1, act: m1, week: 2, kind: desk, est_min: 30, text: "아키타입 §8 밤·살브 정독. 왁스%=경도 감 잡기(립밤10%↓/만능밤15~20%)"}
  - {id: m1-w2-d2, act: m1, week: 2, kind: desk, est_min: 30, text: "밤 변주 1종 설계(오일+버터+왁스), 목표 경도 설정 → formulas/ 작성 + cost로 원가"}
  - {id: m1-w2-l1, act: m1, week: 2, kind: lab, text: "밤 1종 소량 제조(가온 혼합→경화 확인) + 사용감 일지, 경도 관찰"}
  # --- ACT M2 (Week 3) 수상 기초 ---
  - {id: m2-w3-d1, act: m2, week: 3, kind: desk, est_min: 25, text: "아키타입 §1 토너·§2 젤 정독. 팔레트 워터/플로럴워터·보습·점증·보존 카드"}
  - {id: m2-w3-d2, act: m2, week: 3, kind: desk, est_min: 30, text: "브랜드 시그니처 플로럴워터 1종 결정(로즈/네롤리/라벤더…) + 이유 메모. 토너 또는 젤 1종 설계"}
  - {id: m2-w3-d3, act: m2, week: 3, kind: desk, est_min: 20, text: "설계 처방 checks(방부·잔탄검 소량) + labeling으로 표시 tier 확인"}
  - {id: m2-w3-l1, act: m2, week: 3, kind: lab, text: "토너/젤 1종 소량 제조(겔 점증은 소량부터) + 사용감 일지(청량·잔여감)"}
  # --- ACT M3 (Week 4~5) 유화 핵심 ---
  - {id: m3-w4-d1, act: m3, week: 4, kind: desk, est_min: 30, text: "아키타입 §5 로션 정독. 유화 콤비(올리브유화왁스+올리왁스LC)=심장. 오일:유화제 ~1:4~5 감"}
  - {id: m3-w4-d2, act: m3, week: 4, kind: desk, est_min: 30, text: "로션 변주 1종 설계(워터53+오일10+유화4+보습5+활성12 골격) → formulas/ + checks"}
  - {id: m3-w4-l1, act: m3, week: 4, kind: lab, text: "로션 1종 소량 제조(수상·유상 가온→유화→냉각) + 유화 안정 관찰(분리 여부) + 사용감 일지"}
  - {id: m3-w5-d1, act: m3, week: 5, kind: desk, est_min: 25, text: "아키타입 §6 크림 정독. 같은 유화 골격에서 오일↑(25%)·버터 추가로 리치화"}
  - {id: m3-w5-d2, act: m3, week: 5, kind: desk, est_min: 30, text: "W4 로션 골격에서 파생한 크림 1종 설계(백탁은 올리왁스LC로 보정) → formulas/ + cost"}
  - {id: m3-w5-l1, act: m3, week: 5, kind: lab, text: "크림 1종 제조 + RT/45℃ 안정성 시료 배치(관찰 시작) + 로션과 사용감 비교 일지"}
  # --- ACT M4 (Week 6) 활성·스페셜 ---
  - {id: m4-w6-d1, act: m4, week: 6, kind: desk, est_min: 30, text: "아키타입 §3 앰플 정독. 팔레트 활성 카드에서 스타 1~2종 선택(나이아신아마이드·아데노신·펩타이드 등)"}
  - {id: m4-w6-d2, act: m4, week: 6, kind: desk, est_min: 30, text: "히어로 후보 앰플 1종 설계(활성 농축) → formulas/. 미백·주름이면 고시원료·인증 확인"}
  - {id: m4-w6-d3, act: m4, week: 6, kind: desk, est_min: 25, text: "labeling으로 claim·전성분·표시의무 스크리닝 + checks 상충 확인"}
  - {id: m4-w6-l1, act: m4, week: 6, kind: lab, text: "앰플 1종 소량 제조(활성 삼투압·변색 관찰) + 사용감 일지"}
  # --- ACT M5 (Week 7) 세정·확장 ---
  - {id: m5-w7-d1, act: m5, week: 7, kind: desk, est_min: 30, text: "아키타입 §10 세정 3형(폼·클렌징오일·클렌징밤)·§11 샴푸 정독. 클렌징오일=오일+가용화제 비율이 핵심"}
  - {id: m5-w7-d2, act: m5, week: 7, kind: desk, est_min: 30, text: "아키타입 §12 완제베이스 치트키 이해 → 베이스+활성/향만 스왑해 라인 3종 빠르게 설계(formulas/)"}
  - {id: m5-w7-l1, act: m5, week: 7, kind: lab, text: "클렌징(폼 또는 오일) 1종 소량 제조 + 세척력·잔여감 일지"}
  # --- ACT M6 (Week 8) 통합·히어로 ---
  - {id: m6-w8-d1, act: m6, week: 8, kind: desk, est_min: 30, text: "지금까지 설계 중 히어로 1종 선정. SKU 전략(처방 하나→옵션·세트) 스케치"}
  - {id: m6-w8-d2, act: m6, week: 8, kind: desk, est_min: 40, text: "히어로 전체 워크플로우 완주: checks→cost→labeling→prompt_builder(정직 실촬영)→narrative/positioning"}
  - {id: m6-w8-d3, act: m6, week: 8, kind: desk, est_min: 30, text: "히어로 개발 원페이저 작성(컨셉·타깃·골격·claim·서사·원가·가격)"}
  - {id: m6-w8-l1, act: m6, week: 8, kind: lab, text: "히어로 소량 시제 제조 + 사용감 일지 + 지인 3~5명 피드백 수집(소량 검증)"}
