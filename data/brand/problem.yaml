# 기획(Discovery) — 문제 정의 (페르소나·페인·조사를 종합)
# persona_ref 는 personas.yaml 의 id 를 가리킨다.
persona_ref: sensitive-oily-recurring
core_pain: 진정 크림을 발라도 번들·트러블이 반복되고(유분이 오히려 악화), '순한'이라는 말조차 못 믿는다
statement: >
  예민·지성(트러블 반복) 피부를 가진 사람은 자극 없이 진정되는 보습을 원하지만,
  시중 '순한' 크림조차 말라세지아가 대사하는 C11~24 지방산 유분·향료 자극으로
  오히려 상태를 악화시키거나, 무엇을 왜 넣고 뺐는지 성분 근거가 불투명하다.
hypothesis: >
  말라세지아 먹이(C11~24 지방산 오일)를 전면 배제하고 무향 + 진정·피지 성분
  (나이아신아마이드·병풀·베타글루칸·판테놀·징크피씨에이)으로 설계하면,
  '발라도 더 올라오는' 불만을 없앤 편안한 진정 보습이 된다.
success_metric: 4주 사용 후 '번들거림·자극' 관능 점수 개선 + '이건 안 올라온다'는 재구매·후기 확보
