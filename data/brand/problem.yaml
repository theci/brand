# 기획(Discovery) — 문제 정의 (페르소나·페인·조사를 종합)
# persona_ref 는 personas.yaml 의 id 를 가리킨다.
persona_ref: dry-office-30s
core_pain: 오후 건조·당김 + 기존 수분크림의 끈적임(덧바름 불가)
statement: >
  냉난방 실내에서 일하는 30대는 화장 위에도 덧바를 수 있는, 끈적이지 않으면서
  오후까지 가는 보습을 원하지만, 시중 수분크림은 끈적이거나 흡수가 느려 화장을 밀어낸다.
hypothesis: >
  다축 보습(글리세린+히알루론산+판테놀)에 가벼운 유상 설계를 더하면
  '산뜻한 지속 보습'이 되어 오후 당김·덧바름 불만을 해결한다.
success_metric: 사용 4주 후 '오후 당김' 관능 점수 개선 + 덧바름 만족 후기 확보
