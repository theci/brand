# 브랜드 코어 시트 (BrandCore) — 마케팅·디자인 자산의 뿌리
#
# 컨셉 축: "가공하지 않은 파운더" — 완성도가 아니라 정직함이 무기.
#   화려·인공(가상모델/렌더/스톡) 대신, 파운더의 실물·과정·한계를 그대로.
#   1인 특유의 '의도된 불완전(perfectly imperfect)'이 대기업이 못 베끼는 해자.
#   ※ '조잡함'은 무드에만 허용 — 라벨 법정기재·정보 가독성은 절대 타협하지 않는다.
#
# 이 파일은 [디자인 브리프]·[이미지 프롬프트]·[문구검사]에 자동 반영된다.
# ⑥톤·⑦비주얼·⑧금지어/애용어·⑩차별점 = 이번에 확정한 컨셉.
# ①진입점·②페르소나·③적·④약속·⑤근거·⑨한줄 = 제품/브랜드별로 이후 채움(TODO).

# ── 브랜드 식별 ──
# brand_name:                       # TODO: 확정 시 입력(예시 '담/DAAM'은 아직 미확정)
product_ref: "sebum-calm-cream v1"  # 히어로 = 시크 진정 밸런스 크림

# ── ① 카테고리 진입점 / ② 타깃 / ③ 적 / ④ 약속 ──
entry_points:
  - "예민·지성인데 크림 바르면 더 올라온다"
  - "지성 피부 무향 진정크림"
  - "성분 깐깐 진정크림"
persona: "성분 깐깐한 예민·지성 30대 (파운더 본인) — 발라도 더 올라올까 봐 성분을 따진다"
enemy: "'순한'이라 하면서 정작 말라세지아 먹이 유분(C11~24)·향료가 든 진정크림"
promise: "뺀 것(먹이 유분·향료)과 넣은 것(진정·피지 성분)을 그대로 공개하는, 발라도 안 올라오는 무향 진정 보습"

# ── ⑤ 근거 ──
evidence:
  - 말라세지아가 대사하는 C11~24 지방산 오일을 전면 배제한 설계(먹이 아닌 에몰리언트만)
  - 무향 — 향료 자극 배제
  - 같은 고민(예민·지성)의 파운더가 직접 만들고 본인 피부에 씀

# ── ⑥ 톤 형용사 ──  담백·정직 축으로 못박음
tone_adjectives:
  - 담백한
  - 정직한
  - 꾸밈없는
  - 손때 묻은
  - 본질에 집중한

# ── ⑧ 브랜드 금지어 (이 톤과 충돌 → 카피·표기에서 지양) ──
#   ※ 질병·효능 표방 등 '규제' 금지어는 [문구검사]가 별도로 잡는다. 여기는 '브랜드 목소리' 차원.
forbidden_words:
  - 럭셔리
  - 프리미엄
  - 혁신적인
  - 완벽한
  - 최고급

# ── ⑧ 애용어 (담백·과정 공개의 어휘) ──
vocabulary:
  - 그대로
  - 직접
  - 과정
  - 솔직히
  - 아직

# ── ⑦ 비주얼 코드 ──
visual:
  # 컬러: '컬러 1~2개'가 컨셉. 아래는 담백한 중립 팔레트 초안(확정 아님 — 필요시 교체).
  main_color: "#F5F1E8"   # 오프화이트/크라프트 계열(여백·바탕)
  sub_color: "#2B2B2B"    # 먹(텍스트·라인)
  # point_color:          # 포인트는 최소화 — 원료 본연의 색이 있으면 그걸로
  # font_title:           # 산세리프(굵기 낮게) 또는 타자기/손글씨 — 확정 시 입력
  # font_body:            # 가독성 우선 산세리프
  # container:            # 용기(포장재에서 자동 제안)
  # texture:              # 제형 무드
  photo_note: >-
    자연광·핸드헬드로 파운더의 손·작업실·실제 과정을 실촬영한다.
    파운더 실물이 주인공이며 AI 가상모델·3D 렌더·스톡 이미지는 쓰지 않는다.
    보정은 최소(색·먼지 정도) — 의도된 불완전은 매력으로 남긴다.
    단, 라벨 정보·전성분·가독성은 조잡하게 두지 않는다.

# ── ⑨ 한 줄 소개 ──
one_liner: "번들거려서 크림을 못 믿던 내가, 뺄 걸 빼고 만들었습니다."

# ── ⑩ 차별점 — 신소재가 아니라 '뺀 설계 + 정직한 공개'가 비법 ──
differentiators:
  - 말라세지아 먹이 유분(C11~24)을 뺀 설계
  - 뺀 것·넣은 것을 그대로 공개
  - 같은 고민의 파운더가 직접 만들고 씀
differentiation_note: >-
  우리 비법은 신소재가 아니라 '뺀 것을 정직하게 공개하는 것' — 말라세지아가 좋아하는
  유분·향료를 빼고, 무엇을 왜 넣고 뺐는지 파운더가 직접 그대로 보여준다.
  화려함이 아니라 '더 올라오지 않는다'는 신뢰가 무기다.
