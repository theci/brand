    cautions: 리날룰·리모넨 등 표시대상 알러젠을 함유해 함량에 따라 라벨 표기 의무가 생긴다. 임산부·영유아·민감성은 특히 주의. 함량은 공급처 GC 성적서로 확인.
    substitutes:
