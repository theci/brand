# 재고 — 현재 보유 원료·포장. (선택 데이터: 이 파일이 없어도 도구는 동작)
# 원료:
#   on_hand_g   현재 보유량(g)
#   pack_size_g 공급사 판매 단위(g) — 장바구니는 이 배수로 올림
#   pack_price  1팩 가격(원). 없으면 ingredients.yaml의 price_per_kg로 환산
#   expiry      유통기한(미개봉) / opened+pao_months = 개봉 후 사용기한
# 포장: on_hand 보유 개수(구매 단위 MOQ는 packaging.yaml을 따름)
