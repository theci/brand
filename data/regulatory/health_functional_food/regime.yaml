# 건강기능식품(건강기능식품법) 레짐 설정
# ※ 지원 레짐이지만 1인 창업 규모에서는 대부분 CAUTION이다.
#    진입비용은 '제조업 허가·시설요건'을 대표값으로 둔 근사(예시)이며 실제로는 훨씬 크다.
#    개별인정형 기능성 원료는 식약처 개별인정에 수억 원·수년이 든다(별도).
code: health_functional_food
law_name: 건강기능식품에 관한 법률
display_name: 건강기능식품
supported: true

entry_cost: 3000000        # 건기식제조업 허가·시설요건 대표 근사(예시, 실제 더 큼)
lead_time_days: 60         # 품목제조신고(고시형) 등 근사
sku_expansion_cost: 0      # 고시형 품목제조신고 비용은 별도. 개별인정형은 수억(비교엔 entry로 대표)
renewal_period_years: null # 정기 갱신 없음(영업 유지 기준)

notes:
  - "일반식품과 달리 '제조업 허가'와 시설요건이 있어 진입 부담이 크다."
  - "개별인정형 기능성 원료 인정은 수억 원·수년 → 1인 규모에 부적합."
  - "고시형 원료를 쓰더라도 기능성 표시·심의 등 표시광고 규제가 엄격하다."

last_updated: 2026-08-24
