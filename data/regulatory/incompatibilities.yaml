# 원료 상용성(충돌) 규칙 — 사전점검에서 처방을 스캔해 경고.
# 각 규칙: a군 원료와 b군 원료가 같은 처방에 함께 있으면 발동.
# 매칭: ids(원료 id) / categories(카테고리) / inci_contains(INCI 부분문자열, 소문자).
# ⚠️ 일반적으로 통용되는 예시이며 절대적이지 않습니다. 최종은 안정성·상용성 시험으로 확인.
last_updated: 2026-09-04
source_url: https://www.mfds.go.kr
rules:
  - id: niacinamide-vitc
    a: { ids: [niacinamide], inci_contains: [niacinamide] }
    b: { inci_contains: ["ascorbic acid"] }   # 순수 비타민C(유도체 제외)
    severity: medium
    reason: 고농도·저pH에서 나이아신아마이드와 순수 비타민C가 상호작용해 홍조·효력 변화가 보고됨.
    advice: 제형을 분리(주/야)하거나 비타민C 유도체 사용, pH·농도를 관리하세요.

  - id: paraben-nonionic
    a: { inci_contains: [paraben] }
    b: { inci_contains: [polysorbate, "peg-"] }   # 비이온 계면활성제
    severity: medium
    reason: 비이온 계면활성제(폴리소르베이트·PEG)가 파라벤을 가용화해 방부력이 떨어질 수 있음.
    advice: 보존제 계를 재설계하거나 보존 보조를 추가하고 방부력 시험으로 확인하세요.

  - id: cationic-anionic
    a: { inci_contains: [cetrimonium, behentrimonium, quaternium] }   # 양이온 컨디셔너
    b: { inci_contains: ["lauryl sulfate", "laureth sulfate", "cocoyl isethionate"] }  # 음이온 계면활성제
    severity: high
    reason: 양이온(컨디셔너)과 음이온(세정) 계면활성제가 만나면 서로 중화·침전할 수 있음.
    advice: 두 계면활성제를 분리하거나 비이온/양쪽성으로 대체하세요.
