# 일반식품(식품위생법) 레짐 설정
# ※ 진입비용·기간은 예시/확인값이며, 실제 영업등록·품목제조보고 전 관할 기관(지자체·식약처)에 확인할 것.
code: food
law_name: 식품위생법
display_name: 일반식품
supported: true

entry_cost: 28000          # 식품제조가공업 등록 관련 비용 근사(지자체별 상이·예시)
lead_time_days: 14         # 등록·품목제조보고 소요(근사)
sku_expansion_cost: 0      # ★ 품목제조보고는 저비용 → 화장품처럼 SKU 확장 부담 낮음
renewal_period_years: null # 정기 갱신 없음(영업 유지 기준)

notes:
  - "품목마다 품목제조보고가 필요하지만 규제비용 부담은 낮다(지자체 확인)."
  - "미생물·이물 등 식품 안전은 시설·공정(HACCP) 영역 — 이 도구가 대체하지 않는다."
  - "기능성(혈당·면역·다이어트 등)을 표방하면 건강기능식품 영역으로 넘어간다."

last_updated: 2026-08-24
