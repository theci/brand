# 식품 상세페이지 광고 문구 금지·주의 표현 (식품 등의 표시·광고에 관한 법률)
# 카테고리(AdTerm enum): functional_claim(기능성 — 건기식/특수용도 영역) /
#           drug_claim(질병 예방·치료 오인) / absolute_claim(강조표시·절대 표현) /
#           unverified_claim(미검증)
# ※ 초기 데이터는 예시입니다. 실제 표시·광고 실증 가이드로 보강·확인하세요.
last_updated: 2026-08-24
source: "식품 등의 표시·광고에 관한 법률 (확인 필요 예시)"
source_url: "https://www.foodsafetykorea.go.kr/  # 표시·광고 실증 가이드 — 실제 URL로 교체"

terms:
  # --- 기능성(건강기능식품 영역) 표현 ---
  - expression: 다이어트
    category: functional_claim
    risk: high
    suggestion: "체중 관련 표현은 건강기능식품 영역 — 일반식품 표방 주의"
    reference: "체지방 감소 등은 기능성. 일반식품이 표방 시 위반 소지."
  - expression: 면역력
    category: functional_claim
    risk: high
    suggestion: "일반식품은 기능성 표방 불가 (건기식 인정 필요)"
    reference: "면역 기능성은 건강기능식품 인정 대상."
  - expression: 혈당
    category: functional_claim
    risk: high
    suggestion: "혈당 관련은 기능성 — 일반식품 사용 불가"
    reference: "혈당 조절 기능성은 건강기능식품 영역."
  - expression: 체지방
    category: functional_claim
    risk: high
    suggestion: "체지방 감소는 기능성"
    reference: "체지방 감소 기능성은 건강기능식품 인정 대상."

  # --- 질병 예방·치료 오인(의약품 오인) ---
  - expression: 치료
    category: drug_claim
    risk: high
    suggestion: "질병 치료 표방 금지"
    reference: "질병의 예방·치료 효능 표방은 식품에 금지(의약품 오인)."
  - expression: 항암
    category: drug_claim
    risk: high
    suggestion: "질병 예방·치료 암시 금지"
    reference: "암 등 질병 관련 효능 표방은 의약품 오인."
  - expression: 염증
    category: drug_claim
    risk: high
    suggestion: "질병·증상 관련 표현 주의"
    reference: "염증 완화 등은 의약품 오인 소지."

  # --- 강조표시 요건(오인 주의) ---
  - expression: 무설탕
    category: absolute_claim
    risk: medium
    suggestion: "'무당류' 표시기준(당류 ≤0.5g/100g 등) 충족 시에만"
    reference: "'무/저' 강조표시는 표시기준 요건 충족 필요."
  - expression: 무첨가
    category: absolute_claim
    risk: medium
    suggestion: "무첨가 대상·기준을 명확히(오인표시 주의)"
    reference: "포괄적 '무첨가'는 오인·부당 표시 소지."

  # --- 미검증 효과 ---
  - expression: 디톡스
    category: unverified_claim
    risk: medium
    suggestion: "체내 정화 등 미검증 표현 주의"
    reference: "디톡스·해독 등은 실증 없으면 부당광고 소지."
