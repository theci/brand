# 제품 의도 → 레짐/카테고리 매칭 규칙 (RegimeAdvisor)
# ※ 코드가 아니라 이 파일에서 읽는다. 규칙이 겹치면 후보를 모두 반환한다.
# match: use/claim/form 중 지정한 것만 비교(생략=와일드카드). claim은 값 또는 목록.
# ※ 이 규칙은 사전 검토용 근사치입니다. 제품 분류는 최종적으로 관할 기관이 결정합니다.
last_updated: 2026-08-20
source_url: "https://www.easylaw.go.kr/CSP/CnpClsMain.laf?csmSeq=2035&ccfNo=1&cciNo=1&cnpClsNo=1"

rules:
  # --- 공간 + 향: 방향제(화학제품안전법) ---
  - match: { use: space, claim: fragrance, form: sustained_release }
    candidate: { regime: chemical_safety, category_code: 방향제_지속방출형, category_label: "방향제(지속방출형)" }
  - match: { use: space, claim: fragrance, form: liquid }
    candidate: { regime: chemical_safety, category_code: 방향제_비분사형, category_label: "방향제(비분사형)" }
  - match: { use: space, claim: fragrance, form: spray }
    candidate: { regime: chemical_safety, category_code: 방향제_분사형, category_label: "방향제(분사형)" }

  # --- 향 일반: 신체 착향(향수)으로 포지셔닝 시 화장품 (대안 경로) ---
  - match: { claim: fragrance }
    candidate:
      regime: cosmetics
      category_label: "향수(화장품)"
      note: "신체 착향(향수)으로 포지셔닝하면 화장품법 — 관할 기관 확인 필요"

  # --- 탈취: 탈취제(화학제품안전법) ---
  - match: { use: fabric, claim: deodorize, form: liquid }
    candidate: { regime: chemical_safety, category_code: 탈취제_비분사형_액상, category_label: "탈취제(비분사형 액상)" }
  - match: { use: space, claim: deodorize, form: sustained_release }
    candidate: { regime: chemical_safety, category_code: 탈취제_지속방출형, category_label: "탈취제(지속방출형)" }

  # --- 신체 세정/보습: 화장품 ---
  - match: { use: body, claim: cleanse }
    candidate: { regime: cosmetics, category_label: "인체 세정용 화장품(샴푸·바디워시)" }
  - match: { use: body, claim: moisturize }
    candidate: { regime: cosmetics, category_label: "기초 화장품" }

  # --- 살균·살충·방충·기피: 살생물제 (미지원, 승인제) ---
  - match: { claim: sanitize }
    candidate: { regime: biocide, category_label: "살균제" }
  - match: { claim: disinfect }
    candidate: { regime: biocide, category_label: "살균제" }
  - match: { claim: pest_control }
    candidate: { regime: biocide, category_label: "살충제" }
  - match: { claim: repellent }
    candidate: { regime: biocide, category_label: "기피제/방충제" }

  # --- 구강·손소독: 의약외품 (미지원) ---
  - match: { use: body, claim: oral_care }
    candidate: { regime: quasi_drug, category_label: "치약(의약외품)" }
  - match: { claim: hand_sanitize }
    candidate: { regime: quasi_drug, category_label: "손소독제(의약외품)" }
