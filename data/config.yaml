# 브랜드 전역 설정
brand_name: brand-lab
default_currency: KRW
default_batch_g: 100
notes: 집에서 처방 개발 후 OEM 공장에 양산 이관하는 1인 브랜드 워크플로우

# 손익 계산 가정값 (모든 가정의 출처 = 이 파일)
economics:
  channel_fee_rate: 0.30   # 오픈마켓/플랫폼 평균 수수료 30% (사용자 확인 필요)
  shipping_cost: 3000      # 개당 출고 배송비 3,000원
  return_rate: 0.05        # 반품률 5%
  vat_rate: 0.10           # 부가세 10%
  target_margin: 0.40      # 목표 마진율 40%(실매출 대비)

# 레짐 경제성 경고 임계값 (조정 가능)
regulatory_thresholds:
  high_entry_cost: 1000000     # 진입비용이 이 값을 넘으면 경고(원)
  long_lead_time_days: 30      # 시험 기간이 이 값을 넘으면 경고(일)
