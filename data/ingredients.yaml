  - id: allulose
    name: 알룰로스
    inci: Allulose
    category: 감미료(식품)
    price_per_kg: 4500
    density: 1.3
    has_coa: true
    cosmetic_grade: false
    food_grade: true
    grade: food
    nutrition: { kcal_per_100g: 20, carb_g: 90, sugar_g: 0, sodium_mg: 2 }
