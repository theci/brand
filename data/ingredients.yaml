  - id: cocoa-butter
    name: 코코아버터
    inci: Theobroma Cacao (Cocoa) Seed Butter
    category: 버터
    price_per_kg: 22000
    density: 0.90
    has_coa: true
    grade: cosmetic
    cas: "8002-31-1"
    notes: 립밤 경도·바디감 부여

  # --- 왁스 ---
  - id: beeswax
    name: 비즈왁스
    inci: Cera Alba (Beeswax)
    category: 왁스
    price_per_kg: 25000
    density: 0.96
    has_coa: true
    grade: cosmetic
    cas: "8012-89-3"

  - id: candelilla-wax
    name: 칸데릴라왁스
    inci: Euphorbia Cerifera (Candelilla) Wax
    category: 왁스
    price_per_kg: 40000
    density: 0.95
    has_coa: true
    grade: cosmetic
    cas: "8006-44-8"
    notes: 식물성 왁스(비건 립밤용)

  - id: carnauba-wax
    name: 카르나우바왁스
    inci: Copernicia Cerifera (Carnauba) Wax
    category: 왁스
    price_per_kg: 35000
    density: 0.97
    has_coa: true
    grade: cosmetic
    cas: "8015-86-9"
    notes: 융점이 높아 경도 보강

  # --- 지방산 / 지방알코올 (점증·경도) ---
  - id: cetyl-alcohol
    name: 세틸알코올
    inci: Cetyl Alcohol
    category: 점증제
    price_per_kg: 12000
    density: 0.81
    has_coa: true
    grade: cosmetic
    cas: "36653-82-4"
    required_hlb: 15.0   # 지방알코올(공동유화·컨시스턴시). O/W 요구 HLB 높음

  - id: stearic-acid
    name: 스테아릭애씨드
    inci: Stearic Acid
    category: 점증제
    price_per_kg: 8000
    density: 0.85
    has_coa: true
    grade: cosmetic
    cas: "57-11-4"
    notes: 비누 경도 향상, 크림 점도 보강

  - id: lanolin
    name: 라놀린
    inci: Lanolin
    category: 에몰리언트
    price_per_kg: 30000
    density: 0.94
    has_coa: true
    grade: cosmetic
    cas: "8006-54-0"
    notes: 밀착·보습(양모 유래)

  # --- 계면활성제 / 가용화제 ---
  - id: polysorbate-80
    name: 폴리소르베이트80
    inci: Polysorbate 80
    category: 계면활성제
    price_per_kg: 15000
    density: 1.06
    has_coa: true
    grade: cosmetic
    cas: "9005-65-6"
    max_percent: 20.0
    hlb: 15.0            # 고HLB 유화제. O/W 유화에서 공동유화(공급 HLB↑)에 사용.
    notes: 클렌징밤 워터오프(rinse-off)용 유화·가용화 + O/W 공동유화제

  - id: olive-liquid
    name: 올리브리퀴드
    inci: PEG-7 Glyceryl Cocoate
    category: 계면활성제
    price_per_kg: 20000
    density: 1.03
    has_coa: true
    grade: cosmetic
    cas: "68201-46-7"
    max_percent: 15.0
    notes: 온화한 가용화제

  - id: sci
    name: 소듐코코일이세티오네이트
    inci: Sodium Cocoyl Isethionate
    category: 계면활성제
    price_per_kg: 12000
    density: 1.0
    has_coa: true
    grade: cosmetic
    cas: "61789-32-0"
    notes: 고체 샴푸바 주 세정 성분(마일드, noodle/powder)

  - id: capb
    name: 코카미도프로필베타인
    inci: Cocamidopropyl Betaine
    category: 계면활성제
    price_per_kg: 5000
    density: 1.05
    has_coa: true
    grade: cosmetic
    cas: "61789-40-0"
    notes: 보조 계면활성제, 기포·컨디셔닝

  - id: citric-acid
    name: 시트릭애씨드
    inci: Citric Acid
    category: pH조절제
    price_per_kg: 3000
    density: 1.05
    has_coa: true
    grade: cosmetic
    cas: "77-92-9"
    notes: pH 조절(모발용 약산성)

  # --- 보습제 / 용매 ---
  - id: glycerin
    name: 글리세린
    inci: Glycerin
    category: 보습제
    price_per_kg: 4000
    density: 1.26
    has_coa: true
    grade: cosmetic
    cas: "56-81-5"

  - id: water
    name: 정제수
    inci: Aqua
    category: 용매
    price_per_kg: 500
    density: 1.00
    has_coa: true
    grade: cosmetic
    cas: "7732-18-5"
    notes: 비누 lye 용해용

  - id: ethanol
    name: 에탄올(변성)
