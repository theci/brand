# 원료 마스터
# 각 원료: id, name(한글명), inci(INCI 표준명), category(기능/분류)
# 선택: max_percent(권장 상한), price_per_kg(원/kg), density(g/ml),
#       has_coa(성적서 보유), cosmetic_grade(화장품용, 기본 true), grade(등급표기),
#       cas, supplier, notes, fragrance(착향제), colorant(착색제),
#       allergens: [{id, percent}]  (id는 allergens.yaml 참조,
#                   percent는 원료 중 해당 알러젠 함량% — 공급처 CoA/GC 기준)
# ※ price_per_kg / density / has_coa 등은 예시값이며, 실제 견적·성적서로 교체할 것.
# ※ has_coa(성적서)·cosmetic_grade(화장품용 등급)는 UI 원료 페이지에서 붉게 경고된다.

ingredients:
  # --- 오일 / 에스테르 (에몰리언트) ---
  - id: mct
    name: 카프릴릭/카프릭 트리글리세라이드
    inci: Caprylic/Capric Triglyceride
    category: 에몰리언트
    price_per_kg: 15000
    density: 0.95
    has_coa: true
    grade: cosmetic
    cas: "73398-61-5"
    required_hlb: 11.0
    notes: 산패에 강하고 발림성이 가벼운 범용 베이스 오일. 카프릴릭(C8)·카프릭(C10)은 C11 미만 → 말라세지아 먹이 아님(안전).

  - id: jojoba-oil
    name: 호호바오일
    inci: Simmondsia Chinensis (Jojoba) Seed Oil
    category: 에몰리언트
    price_per_kg: 45000
    density: 0.87
    has_coa: true
    grade: cosmetic
    cas: "61789-91-1"
    required_hlb: 6.5    # O/W 유화에 필요한 HLB(오일마다 다름). check 명령이 사용.
    notes: 왁스 에스테르 구조로 안정성이 높음

  - id: castor-oil
    name: 피마자오일
    inci: Ricinus Communis (Castor) Seed Oil
    category: 에몰리언트
    price_per_kg: 8000
    density: 0.96
    has_coa: true
    grade: cosmetic
    cas: "8001-79-4"
    notes: 립밤 광택·부착력 향상

  - id: olive-oil
    name: 올리브오일
    inci: Olea Europaea (Olive) Fruit Oil
    category: 에몰리언트
    price_per_kg: 12000
    density: 0.91
    has_coa: true
    grade: cosmetic
    cas: "8001-25-0"
    notes: 비누 베이스 오일(온화, 컨디셔닝)

  - id: coconut-oil
    name: 코코넛오일
    inci: Cocos Nucifera (Coconut) Oil
    category: 에몰리언트
    price_per_kg: 9000
    density: 0.92
    has_coa: true
    grade: cosmetic
    cas: "8001-31-8"
    notes: 비누 기포·경도 향상

  - id: sweet-almond-oil
    name: 스위트아몬드오일
    inci: Prunus Amygdalus Dulcis (Sweet Almond) Oil
    category: 에몰리언트
    price_per_kg: 20000
    density: 0.91
    has_coa: true
    grade: cosmetic
    cas: "8007-69-0"

  - id: sunflower-oil
    name: 해바라기씨오일
    inci: Helianthus Annuus (Sunflower) Seed Oil
    category: 에몰리언트
    price_per_kg: 6000
    density: 0.92
    has_coa: false   # 성적서 미확보 — UI에서 경고
    grade: cosmetic
    cas: "8001-21-6"

  - id: squalane
    name: 스쿠알란
    inci: Squalane
    category: 에몰리언트
    price_per_kg: 90000
    density: 0.81
    has_coa: true
    grade: cosmetic
    cas: "111-01-3"
    required_hlb: 12.0   # O/W 유화에 필요한 HLB
    notes: 무색·무취, 산화 안정성 우수

  # --- 버터 ---
  - id: shea-butter
    name: 시어버터
    inci: Butyrospermum Parkii (Shea) Butter
    category: 버터
    price_per_kg: 18000
    density: 0.90
    has_coa: true
    grade: cosmetic
    cas: "194043-92-0"
