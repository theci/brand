    category: 보습제
    price_per_kg: 30000
    density: 1.2
    has_coa: true
    grade: cosmetic
    cas: "16485-10-2"
    notes: 수용성 보습·진정 활성. 보습과 다른 '진정' 축을 더하는 USP 원료. 권장 0.5~5%.

  - id: xanthan-gum
    name: 잔탄검
    inci: Xanthan Gum
    category: 점증제
    price_per_kg: 18000
    density: 0.9
    has_coa: true
    grade: cosmetic
    notes: 천연 점증제(발효 유래). 수상을 걸쭉하게 만들어 유화 안정성을 도움. 0.1~0.5%.

  - id: phenoxyethanol
    cas: "122-99-6"
    name: 페녹시에탄올
    inci: Phenoxyethanol
    category: 보존제
    price_per_kg: 9000
    density: 1.1
    has_coa: true
    grade: cosmetic
    max_percent: 1.0
    notes: 광범위 보존제. 물 든 제품 필수. 국내·EU 배합한도 1.0%.

  - id: hexanediol
    name: 1,2-헥산다이올
