    category: 보습제
    price_per_kg: 13000
    density: 0.95
    has_coa: true
    grade: cosmetic
    notes: 보습 겸 항균 보조. 보존제 효과를 보강해 방부력을 높임.

  # --- 방향제(리드 디퓨저)용 원료: 용제·확산보조 ---
  - id: dpg
    name: 디프로필렌글라이콜
    inci: Dipropylene Glycol
    category: 용제
    price_per_kg: 4000
    density: 1.02
    has_coa: true
    grade: cosmetic
    cas: "25265-71-8"
    notes: 디퓨저 베이스 용제. 향을 녹이고 리드로 천천히 끌어올림. 저취·저휘발.

  - id: ipm
    name: 이소프로필미리스테이트
    inci: Isopropyl Myristate
    category: 용제
    price_per_kg: 6000
    density: 0.85
    has_coa: true
    grade: cosmetic
    cas: "110-27-0"
    notes: 확산 보조. 향이 리드를 타고 잘 올라오게 함(모세관 상승 촉진).

  # --- 섬유 탈취제용: 소취(냄새 포집) 성분 ---
  - id: cyclodextrin
    name: 하이드록시프로필사이클로덱스트린
    inci: Hydroxypropyl Cyclodextrin
    category: 소취제
    price_per_kg: 45000
    density: 1.0
    has_coa: true
    grade: cosmetic
    cas: "128446-35-5"
    notes: 도넛 모양 분자. 가운데 구멍에 냄새 분자를 가둬(캡슐화) 냄새를 '덮지 않고 잡음'.

  # =========================================================================
  # 식품(food) 레짐용 원료 — food_grade: true, grade: food, nutrition 포함.
  # ※ nutrition(100g당) 값은 예시이며, 공급처 성적서/식품영양 DB로 교체할 것.
  #    화장품 원료가 아니므로 cosmetic_grade: false (원료 페이지에서 붉게 표시).
  # =========================================================================
  - id: purified-water
    name: 정제수
    inci: Water
    category: 용제(식품)
    price_per_kg: 200
    density: 1.0
    has_coa: true
    cosmetic_grade: false
    food_grade: true
    grade: food
    nutrition: { kcal_per_100g: 0, carb_g: 0, sugar_g: 0, sodium_mg: 0 }
