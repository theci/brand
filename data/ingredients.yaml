  - id: gelatin
    name: 젤라틴
    inci: Gelatin
    category: 겔화제(식품)
    price_per_kg: 12000
    density: 1.3
    has_coa: true
    cosmetic_grade: false
    food_grade: true
    grade: food
    nutrition: { kcal_per_100g: 335, protein_g: 85, carb_g: 0, sugar_g: 0, sodium_mg: 40 }
    notes: 젤리 식감(겔) 형성. 단백질원(예시값).

  - id: apple-juice-concentrate
    name: 사과농축과즙
    inci: Apple Juice Concentrate
    category: 과즙(식품)
    price_per_kg: 3500
    density: 1.2
    has_coa: true
    cosmetic_grade: false
    food_grade: true
    grade: food
    nutrition: { kcal_per_100g: 200, carb_g: 49, sugar_g: 46, sodium_mg: 5 }
    notes: 천연 단맛·풍미. 당류의 주요 출처(예시값).

  - id: citric-acid-food
    name: 구연산(식품용)
    inci: Citric Acid
    category: 산미료(식품)
    price_per_kg: 3000
    density: 1.05
    has_coa: true
    cosmetic_grade: false
