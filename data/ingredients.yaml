    category: 보습제
    price_per_kg: 200000
    density: 1.0
    has_coa: true
    grade: cosmetic
    notes: 고분자 보습제. 자기 무게의 수백 배 수분을 잡아둠. 0.1~0.5%만 써도 충분.

