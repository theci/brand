    has_coa: true
    grade: cosmetic
    cas: "1310-73-2"
    notes: 콜드프로세스 비누화(완제품에는 잔존하지 않음)

  # --- 산화방지제 ---
  - id: tocopherol
    name: 토코페롤
    inci: Tocopherol
    category: 산화방지제
    price_per_kg: 60000
    density: 0.95
    has_coa: true
    grade: cosmetic
    cas: "59-02-9"
    max_percent: 1.0

  - id: vitamin-e-acetate
    name: 토코페릴아세테이트
    inci: Tocopheryl Acetate
    category: 산화방지제
    price_per_kg: 50000
    density: 0.95
    has_coa: true
    grade: cosmetic
    cas: "7695-91-2"
    max_percent: 1.0

  # --- 에센셜 오일 / 추출물 (향·기능) ---
  - id: lavender-eo
    name: 라벤더오일
    inci: Lavandula Angustifolia (Lavender) Oil
    category: 에센셜오일
    price_per_kg: 120000
    density: 0.89
    has_coa: true
    grade: cosmetic
    cas: "8000-28-0"
    max_percent: 2.0
    fragrance: true
    # 예시값 — 실제는 공급처 GC 성적서로 대체할 것
    allergens:
      - { id: linalool, percent: 30.0 }
      - { id: limonene, percent: 1.0 }
      - { id: geraniol, percent: 0.5 }
      - { id: coumarin, percent: 0.2 }

  - id: peppermint-eo
    name: 페퍼민트오일
    inci: Mentha Piperita (Peppermint) Oil
    category: 에센셜오일
    price_per_kg: 80000
    density: 0.90
    has_coa: true
    grade: cosmetic
    cas: "8006-90-4"
    max_percent: 2.0
    fragrance: true
    allergens:
      - { id: limonene, percent: 2.0 }

  - id: rosemary-extract
    name: 로즈마리추출물
    inci: Rosmarinus Officinalis (Rosemary) Leaf Extract
    category: 산화방지제
    price_per_kg: 100000
    density: 0.95
    has_coa: false   # 성적서 미확보 — UI에서 경고
    grade: cosmetic
    cas: "84604-14-8"
    max_percent: 1.0

  # --- ⚠️ 화장품용 아님(캔들용) — 실수 방지용 예시. 처방에 쓰지 말 것 ---
  - id: candle-fragrance
    name: 캔들용 프래그런스 오일
    inci: Fragrance (candle grade)
    category: 착향제
    price_per_kg: 25000
    density: 0.95
    has_coa: false
    cosmetic_grade: false   # 화장품용 아님 — UI에서 붉게 경고
    grade: candle
    fragrance: true
    notes: 캔들·디퓨저용. 피부 안전성 미검증 → 화장품 처방 사용 금지.

  # --- 에멀전(수분로션)용 원료: 유화제·보습제·점증제·보존제 ---
  - id: glyceryl-stearate-citrate
    name: 글리세릴스테아레이트시트레이트
    inci: Glyceryl Stearate Citrate
    category: 유화제
    price_per_kg: 25000
    density: 0.9
    has_coa: true
    grade: cosmetic
    hlb: 10.0            # 이 유화제가 '공급'하는 HLB. check 명령이 요구 HLB와 비교.
    notes: O/W(수중유형) 유화제. 오일과 물을 섞어 유화(에멀전)를 만드는 핵심 원료.

  - id: sodium-hyaluronate
    name: 소듐하이알루로네이트(히알루론산)
