    category: 용매
    price_per_kg: 3500
    density: 0.79
    has_coa: true
    grade: cosmetic
    cas: "64-17-5"
    notes: 방향제·룸스프레이 용매, 향 가용화

  # --- 비누화제 ---
  - id: sodium-hydroxide
    name: 수산화나트륨
