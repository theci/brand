# 향료 원료 마스터
# 각 원료: id, 이름, 노트(top/middle/base), 계열
# 선택: cas, 희석농도_보유(%), 단가_원_per_10ml, 구매처,
#       ifra_한도_퍼센트(완제품 중 %), 알러젠_해당, 화장품용_등급, 시향_메모
# ※ 단가·IFRA 한도 등은 예시값이며, 실제 견적·IFRA Standards로 교체할 것.

materials:
  # --- Top / Citrus ---
  - id: bergamot
    이름: 베르가못
    cas: "8007-75-8"
    노트: top
    계열: citrus
    희석농도_보유: [10, 1]
    단가_원_per_10ml: 4500
    구매처: 향료상사A
    ifra_한도_퍼센트: 0.4    # 광독성(FCF 아님) 기준 예시
    알러젠_해당: true
    화장품용_등급: true
    시향_메모: 화사한 시트러스, 살짝 플로럴

  - id: lemon
    이름: 레몬
    cas: "8008-56-8"
    노트: top
    계열: citrus
    희석농도_보유: [10]
    단가_원_per_10ml: 3000
    구매처: 향료상사A
    ifra_한도_퍼센트: 3.0
    알러젠_해당: true
    화장품용_등급: true
    시향_메모: 쨍한 톱노트, 휘발 빠름

  # --- Middle / Floral ---
  - id: geranium
    이름: 제라늄
    cas: "8000-46-2"
    노트: middle
    계열: floral
    희석농도_보유: [10, 1]
    단가_원_per_10ml: 5000
    구매처: 향료상사B
    알러젠_해당: true
    화장품용_등급: true
    시향_메모: 로지-그린, 미들 연결

  - id: rose-absolute
    이름: 로즈 앱솔루트
    cas: "8007-01-0"
    노트: middle
    계열: floral
    희석농도_보유: [10, 1]
    단가_원_per_10ml: 42000
    구매처: 향료상사B
    알러젠_해당: true
    화장품용_등급: true
    시향_메모: 진한 로즈, 소량으로 충분

  # --- Base / Woody · Musk ---
  - id: sandalwood
    이름: 샌달우드
    cas: "8006-87-9"
    노트: base
    계열: woody
    희석농도_보유: [10]
    단가_원_per_10ml: 15000
    구매처: 향료상사B
    알러젠_해당: false
    화장품용_등급: true
    시향_메모: 크리미 우디, 지속력 좋음

  - id: cedarwood
    이름: 시더우드
    cas: "8000-27-9"
    노트: base
    계열: woody
    희석농도_보유: [10]
    단가_원_per_10ml: 3500
    구매처: 향료상사A
    알러젠_해당: false
    화장품용_등급: true
    시향_메모: 드라이 우디, 볼륨감

  - id: iso-e-super
    이름: 이소 이 슈퍼
    cas: "54464-57-2"
    노트: base
    계열: woody
    희석농도_보유: [10]
    단가_원_per_10ml: 2000
    구매처: 향료상사C
    알러젠_해당: false
    화장품용_등급: true
    시향_메모: 벨벳 우디-앰버, 확산성

  - id: ambroxan
    이름: 앰브록산
    cas: "6790-58-5"
    노트: base
    계열: musk
    희석농도_보유: [10, 1]
    단가_원_per_10ml: 9000
    구매처: 향료상사C
    알러젠_해당: false
    화장품용_등급: true
    시향_메모: 앰버-머스크, 잔향

  - id: vanillin
    이름: 바닐린
    cas: "121-33-5"
    노트: base
    계열: gourmand
    희석농도_보유: [10]
    단가_원_per_10ml: 2500
    구매처: 향료상사C
    알러젠_해당: false
    화장품용_등급: true
    시향_메모: 스위트 바닐라, 착향 강함

  # --- ⚠️ 화장품용 아님(캔들용) — 실수 방지용 예시. 향수 처방에 쓰지 말 것 ---
  - id: candle-musk
    이름: 캔들용 화이트머스크
    노트: base
    계열: musk
    희석농도_보유: [10]
    단가_원_per_10ml: 1200
    구매처: 캔들재료상
    알러젠_해당: false
    화장품용_등급: false
    시향_메모: 캔들·디퓨저용. 피부 안전성 미검증 → 향수 사용 금지.
