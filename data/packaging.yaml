# 패키지 마스터
# 각 패키지: id, name, type
# 선택: volume_ml, material, unit_price(개당 원), moq(최소 주문 수량), supplier, notes
# ※ unit_price / moq 는 예시값이며, 실제 견적으로 교체할 것.

packaging:
  - id: jar-50ml
    name: 50ml 유리 자
    type: jar
    volume_ml: 50
    material: 유리
    unit_price: 800
    moq: 3000
    notes: 클렌징밤용 광구병 · 로션 미니(50mL) 겸용 — 기존 재고 소진처. 커스텀 사양이라 MOQ 3,000(선투입·사장재고 큼).

  # ── 지성 진정 크림(sebum-calm-cream) 용기 MOQ 재검토용 대안 (2026-09 추가, 단가·MOQ 예시) ──
  - id: jar-50ml-stock
    name: 50ml 규격(상시재고) 크림 자
    type: jar
    volume_ml: 50
    material: PET/PP(무광 화이트)
    unit_price: 1300
    moq: 100
    notes: >
      국내 유통사 상시재고 규격 용기 → MOQ 100개로 초도 소량 가능(단가는 커스텀보다 높음).
      1인 초도 검증(수십~수백개)에 최적. 단가·MOQ 예시 — 실제 견적으로 교체.

  - id: airless-50ml
    name: 50ml 에어리스 펌프
    type: bottle
    volume_ml: 50
    material: PP(에어리스 진공)
    unit_price: 1100
    moq: 1000
    notes: >
      에어리스 진공 = 공기·손 접촉 차단(무향·저방부·예민피부 크림에 위생·산화방지 유리).
      MOQ 1,000으로 중간. 단가·MOQ 예시.

  - id: cream-tube-50ml
    name: 50ml 크림 튜브
    type: tube
    volume_ml: 50
    material: PE 튜브(무광)
    unit_price: 450
    moq: 1000
    notes: >
      짜서 쓰는 튜브 = 위생·경량·저가. 담백 컨셉과 부합. MOQ 1,000. 단가·MOQ 예시.

  - id: pump-200ml
    name: 200ml 에어리스 진공 펌프 보틀
    type: bottle
    volume_ml: 200
    material: PP(에어리스, 반투명 무광)
    unit_price: 1800
    moq: 3000
    notes: >
      산뜻 보습 로션 본품(200mL). 에어리스 진공 = 공기 차단·산화 방지(저방부 처방 유리) + 반투명 무광 = 담백 컨셉 부합.
      규격: 지름 55mm · 전체 높이 174mm(펌프 포함). 라벨 둘레 = π×55 ≈ 173mm.
      단가·MOQ는 예시 — 구매페이지 실제 값으로 교체할 것.

  - id: lipbalm-tube-10ml
    name: 10ml 립밤 튜브
    type: tube
    volume_ml: 10
    material: PP
    unit_price: 350
    moq: 2000

  - id: lipbalm-tin-15ml
    name: 15ml 립밤 틴
    type: tin
    volume_ml: 15
    material: 알루미늄
    unit_price: 500
    moq: 2000

  - id: dropper-30ml
    name: 30ml 드로퍼 병
    type: bottle
    volume_ml: 30
    material: 유리
    unit_price: 900
    moq: 3000
    notes: 페이스오일용 스포이드 캡

  - id: soap-box
    name: 비누 종이 박스
    type: box
    material: 종이
    unit_price: 300
    moq: 1000
    notes: 90~100g 비누바 1개 포장

  - id: diffuser-bottle-200ml
    name: 200ml 디퓨저 유리병 + 리드스틱
    type: bottle
    volume_ml: 200
    material: 유리
    unit_price: 2500
    moq: 1000
    notes: 방향제(리드 디퓨저)용 병·리드 세트

  - id: trigger-spray-300ml
    name: 300ml 트리거 스프레이 보틀
    type: spray
    volume_ml: 300
    material: PET
    unit_price: 700
    moq: 2000
    notes: 섬유 탈취 스프레이용 분사 트리거 보틀

  - id: jelly-pouch-30g
    name: 30g 젤리 스틱 파우치
    type: pouch
    material: 필름(식품용)
    unit_price: 120
    moq: 5000
    notes: 저당 젤리(상온 유통)용 개별 스틱 파우치. 식품 포장재.

  - id: icecream-cup-100
    name: 100ml 아이스크림 컵(뚜껑 포함)
    type: cup
    volume_ml: 100
    material: 종이+PE(식품용)
    unit_price: 150
    moq: 5000
    notes: 저당 아이스크림용 미니컵+돔뚜껑. 냉동 유통(콜드체인) 필요.

  - id: nut-pack-30g
    name: 30g 견과 시즈닝 파우치(질소충전)
    type: pouch
    material: 알루미늄증착 필름(식품용)
    unit_price: 200
    moq: 5000
    notes: 시즈닝 견과용 질소충전 봉지. 차광·산소차단으로 산패 지연. 상온 유통.
